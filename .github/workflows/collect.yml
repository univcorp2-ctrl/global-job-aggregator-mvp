name: Collect jobs

on:
  push:
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Collect jobs
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          JOB_KEYWORDS: ${{ vars.JOB_KEYWORDS }}
          MAX_PER_SOURCE: ${{ vars.MAX_PER_SOURCE }}
        run: |
          mkdir -p data
          python scripts/collect_once.py --force --summary-path data/collection-summary.json
          test -f data/jobs.db
          test -f data/collection-summary.json
      - name: Upload SQLite DB and summary
        uses: actions/upload-artifact@v4
        with:
          name: jobs-sqlite-db
          path: |
            data/jobs.db
            data/collection-summary.json
          if-no-files-found: error
